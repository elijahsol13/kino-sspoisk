  <rect x="867" y="193" width="304" height="30" rx="13" fill="#343d53"/>
  <text x="881" y="212" fill="#edf1fb" font-size="13">kinokino.win/film/…</text>
  <rect x="897" y="243" width="244" height="77" rx="10" fill="#27364c"/>
  <circle cx="1019" cy="282" r="25" fill="url(#orange)"/>
  <path d="M1012 269 L1033 282 L1012 295 Z" fill="#121620"/>
  <text x="405" y="261" fill="#ffae82" font-size="28">›</text>
  <text x="804" y="261" fill="#ffae82" font-size="28">›</text>
</g>
</svg>
