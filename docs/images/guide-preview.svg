<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" role="img" aria-labelledby="title desc">
<title id="title">Kino → SSpoisk: как работает расширение</title>
<desc id="desc">Три иллюстрированных шага: поиск фильма, открытие карточки Кинопоиска, переход на страницу SSpoisk по кнопке.</desc>
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a2131"/><stop offset="1" stop-color="#2a2030"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#252e44"/><stop offset="1" stop-color="#182130"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff925d"/><stop offset="1" stop-color="#f5653b"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-opacity=".22"/></filter>
</defs>
<rect width="1240" height="420" rx="24" fill="url(#back)"/>
<circle cx="1180" cy="-70" r="180" fill="#f5653b" opacity=".07"/>
<circle cx="60" cy="480" r="200" fill="#526bb4" opacity=".08"/>
<text x="46" y="56" font-size="23" fill="#fff" font-family="Arial, sans-serif" font-weight="700">Как это работает</text>
<text x="46" y="85" font-size="15" fill="#bbc5d8" font-family="Arial, sans-serif">Всего три шага — от поиска до нужной страницы</text>
<g filter="url(#shadow)">
  <rect x="46" y="117" width="350" height="258" rx="18" fill="url(#panel)" stroke="#45516a"/>
  <rect x="445" y="117" width="350" height="258" rx="18" fill="url(#panel)" stroke="#45516a"/>
  <rect x="844" y="117" width="350" height="258" rx="18" fill="url(#panel)" stroke="#45516a"/>
</g>
<g font-family="Arial, sans-serif">
  <rect x="67" y="138" rx="9" width="30" height="30" fill="url(#orange)"/><text x="77" y="159" font-size="17" font-weight="700" fill="#14151e">1</text>
  <text x="107" y="159" fill="white" font-size="19" font-weight="700">Найдите фильм</text>
  <rect x="69" y="193" width="302" height="148" rx="14" fill="#171d2b" stroke="#42506a"/>
  <text x="88" y="223" fill="#f4f5fa" font-size="16" font-weight="700">▶ Kino → SSpoisk</text>
  <rect x="88" y="238" width="264" height="39" rx="8" fill="#2c3548" stroke="#f58a62"/>
  <text x="99" y="262" fill="#f2f5fa" font-size="14">Интерстеллар</text>
  <rect x="88" y="285" width="264" height="37" rx="8" fill="url(#orange)"/>
  <text x="132" y="310" fill="#1c2029" font-weight="700" font-size="14">Найти на Кинопоиске →</text>
  <rect x="466" y="138" rx="9" width="30" height="30" fill="url(#orange)"/><text x="476" y="159" font-size="17" font-weight="700" fill="#14151e">2</text>
  <text x="506" y="159" fill="white" font-size="19" font-weight="700">Откройте карточку</text>
  <rect x="468" y="193" width="304" height="148" rx="14" fill="#171d2b" stroke="#42506a"/>
  <rect x="468" y="193" width="304" height="29" rx="13" fill="#111827"/>
  <text x="483" y="213" fill="#c3cadd" font-size="12">Кинопоиск</text>
  <rect x="487" y="237" width="56" height="83" rx="5" fill="#5c687e"/>
  <rect x="487" y="237" width="56" height="83" rx="5" fill="#a36f6a" opacity=".35"/>
  <text x="555" y="253" fill="white" font-size="15" font-weight="700">Карточка фильма</text>
  <text x="555" y="275" fill="#acb5c7" font-size="12">Рейтинг, описание…</text>
  <rect x="554" y="286" width="202" height="34" rx="7" fill="url(#orange)"/>
  <text x="573" y="308" fill="#191c23" font-size="13" font-weight="700">▶ Смотреть онлайн</text>
  <rect x="865" y="138" rx="9" width="30" height="30" fill="url(#orange)"/><text x="875" y="159" font-size="17" font-weight="700" fill="#14151e">3</text>
  <text x="905" y="159" fill="white" font-size="19" font-weight="700">Откройте SSpoisk</text>
